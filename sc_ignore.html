<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>스타크래프트 공방 /ignore 추출기</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #1e1e24;
            color: #ffffff;
        }
        h2 {
            border-bottom: 2px solid #4a4a5a;
            padding-bottom: 10px;
        }
        textarea {
            width: 100%;
            height: 180px;
            background-color: #2d2d37;
            color: #fff;
            border: 1px solid #4a4a5a;
            border-radius: 4px;
            padding: 10px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button.primary {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            background-color: #007acc;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button.primary:hover {
            background-color: #005999;
        }
        .result-container {
            margin-top: 25px;
            background-color: #25252f;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #3f3f4f;
        }
        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .copy-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #2d2d37;
            padding: 10px 15px;
            border-radius: 4px;
            border: 1px solid #4a4a5a;
        }
        .cmd-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            font-weight: bold;
            color: #ffcc00;
        }
        .btn-copy {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-copy:hover {
            background-color: #218838;
        }
        .btn-copy.copied {
            background-color: #6c757d;
        }
    </style>
</head>
<body>

    <h2>스타크래프트1 차단(/ignore) 텍스트 생성기</h2>
    <p style="color: #ccc; font-size: 14px;">
        복사한 텍스트를 통째로 넣고 추출 버튼을 누르세요. 한 줄씩 간편하게 복사할 수 있는 개별 버튼이 생성됩니다.
    </p>

    <textarea id="rawInput" placeholder="여기에 복사한 전적 텍스트를 붙여넣으세요...&#10;예) abc: [Asia] 현재 시즌...&#10;def: [Korea] 사용자 지정..."></textarea>
    
    <button class="primary" onclick="extractIds()">개별 복사 버튼 만들기</button>

    <div class="result-container">
        <h3>추출 결과 (버튼을 누르면 해당 명령어만 즉시 복사됩니다)</h3>
        <div id="buttonArea" class="btn-list">
            <span style="color: #888;">추출된 아이디가 없습니다. 먼저 위 버튼을 눌러주세요.</span>
        </div>
    </div>

    <script>
        function extractIds() {
            const rawText = document.getElementById('rawInput').value;
            const lines = rawText.split('\n');
            const idSet = new Set(); // 중복 제거

            lines.forEach(line => {
                const trimmed = line.trim();
                
                // 지정하신 ": [" 패턴이 있는지 확인 (서버 무관하게 필터링)
                if (trimmed.includes(': [')) {
                    // ": [" 문자열이 시작하는 인덱스를 기준으로 앞부분만 자름
                    const targetIndex = trimmed.indexOf(': [');
                    if (targetIndex > 0) {
                        const id = trimmed.substring(0, targetIndex).trim();
                        if (id) {
                            idSet.add(id);
                        }
                    }
                }
            });

            const buttonArea = document.getElementById('buttonArea');
            buttonArea.innerHTML = ''; // 기존 버튼 영역 초기화

            const idList = Array.from(idSet);

            if (idList.length === 0) {
                buttonArea.innerHTML = '<span style="color: #ff5555;">적합한 패턴(아이디: [서버명])을 찾지 못했습니다.</span>';
                return;
            }

            // 각 아이디별로 한 줄씩 복사할 수 있는 아이템 생성
            idList.forEach(id => {
                const command = `/ignore ${id}`;
                
                const itemDiv = document.createElement('div');
                itemDiv.className = 'copy-item';

                const textSpan = document.createElement('span');
                textSpan.className = 'cmd-text';
                textSpan.textContent = command;

                const copyBtn = document.createElement('button');
                copyBtn.className = 'btn-copy';
                copyBtn.textContent = '복사';
                copyBtn.onclick = function() {
                    copySingleText(command, copyBtn);
                };

                itemDiv.appendChild(textSpan);
                itemDiv.appendChild(copyBtn);
                buttonArea.appendChild(itemDiv);
            });
        }

        // 개별 텍스트 복사 함수
        function copySingleText(text, buttonElement) {
            // 가상 input 요소를 생성하여 클립보드에 복사 실행
            const tempInput = document.createElement('input');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            // 사용자 편의성 피드백: 복사된 버튼의 텍스트와 색상을 잠시 변경
            const originalText = buttonElement.textContent;
            buttonElement.textContent = '복사 완료!';
            buttonElement.classList.add('copied');
            
            setTimeout(() => {
                buttonElement.textContent = originalText;
                buttonElement.classList.remove('copied');
            }, 1000);
        }
    </script>
</body>
</html>
